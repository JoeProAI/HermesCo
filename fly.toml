app = "hermesco"
primary_region = "iad"

[build]
  [build.args]
    NEXT_PUBLIC_CONVEX_URL = "https://rapid-ermine-712.convex.cloud"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_CONVEX_URL = "https://rapid-ermine-712.convex.cloud"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
