<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="176" height="176" rx="38" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Subtle grid -->
  <g stroke="#00ff9f" stroke-opacity="0.05" stroke-width="1">
    <line x1="45" y1="0" x2="45" y2="180"/>
    <line x1="90" y1="0" x2="90" y2="180"/>
    <line x1="135" y1="0" x2="135" y2="180"/>
    <line x1="0" y1="45" x2="180" y2="45"/>
    <line x1="0" y1="90" x2="180" y2="90"/>
    <line x1="0" y1="135" x2="180" y2="135"/>
  </g>
  
  <!-- Stylized C with claw/terminal aesthetic -->
  <g transform="translate(90, 90)" filter="url(#glow)">
    <!-- Main C shape resembling a lobster claw -->
    <path d="M35 -45 C15 -60, -25 -60, -45 -40 C-60 -15, -60 15, -45 40 C-25 60, 15 60, 35 45" 
          fill="none" stroke="#00ff9f" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Terminal cursor accent -->
    <rect x="30" y="-20" width="15" height="40" rx="2" fill="#00ff9f">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Corner accent -->
  <circle cx="155" cy="155" r="8" fill="#00ff9f" fill-opacity="0.3"/>
</svg>
